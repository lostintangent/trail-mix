# Package scripts name their runtime: `bun --bun` for Bun, `node` for what starts the local Workers
# runtime. `[run] bun = true` stays off, because it would make `node` inside every script mean Bun.

[install]
# `bun add` records the exact version it installed. Upgrades are deliberate edits.
exact = true

[fmt]
printWidth = 100
singleQuote = true
# Generated: the route tree by TanStack Start, the theme by `bun run theme`.
ignorePatterns = ["src/app/routeTree.gen.ts", "src/app/theme/built/", "worker-configuration.d.ts"]

[test]
preload = ["./tests/preload.ts"]
# Tests that need the test mail server and workerd run with `bun run test:mail`, not `bun test`.
pathIgnorePatterns = ["**/*.mail.test.ts"]

[lint]
# Also run the rules that need types, such as a promise nobody awaits.
typeAware = true
# A warning fails the run, so `bun lint` either passes or it does not.
maxWarnings = 0
ignorePatterns = ["src/app/routeTree.gen.ts", "src/app/theme/built/", "worker-configuration.d.ts"]
