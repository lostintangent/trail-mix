<p>Event handlers that fire without a click.</p>
<img src="x" onerror="parent.__pwned('img-onerror')">
<img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" onload="parent.__pwned('img-onload')">
<svg onload="parent.__pwned('svg-onload')"></svg>
<details open ontoggle="parent.__pwned('details-ontoggle')"><summary>open</summary>x</details>
<div style="height:120px" onmouseover="parent.__pwned('onmouseover')" onmouseenter="parent.__pwned('onmouseenter')">Hover here</div>
<input autofocus onfocus="parent.__pwned('autofocus')">
<a href="#" tabindex="1" autofocus onfocusin="parent.__pwned('focusin')">focus</a>
<marquee onstart="parent.__pwned('marquee')">scroll</marquee>
<video src="x" onerror="parent.__pwned('video-onerror')"></video>
<audio src="x" onerror="parent.__pwned('audio-onerror')"></audio>
<style onload="parent.__pwned('style-onload')"></style>
<body onload="parent.__pwned('body-onload')" onpageshow="parent.__pwned('pageshow')">
<div onanimationstart="parent.__pwned('animation')" style="animation: tm-spin 1ms"></div>
<style>@keyframes tm-spin { to { opacity: 0.5 } }</style>
