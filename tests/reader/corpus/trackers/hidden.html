<!-- Images hidden from view. Every address with "keep" in it must load once images are allowed, and no other may. -->
<style>
  @media (prefers-color-scheme: dark) {
    .dark-logo { display: block !important; }
    .light-logo { display: none !important; }
  }
  @media only screen and (max-width: 480px) {
    .phone-only { display: block !important; max-height: none !important; overflow: visible !important; }
  }
  .outweighed { display: block; }
</style>
<div style="display:none;max-height:0;overflow:hidden;mso-hide:all">Your week in review <img src="{{canary}}/track/preheader.gif" alt=""></div>
<img src="{{canary}}/keep/light-logo.png" class="light-logo" width="200" height="50" alt="Logo">
<img src="{{canary}}/keep/dark-logo.png" class="dark-logo" style="display:none" width="200" height="50" alt="Logo">
<!--[if !mso]><!-->
<div class="phone-only" style="display:none;max-height:0;overflow:hidden;mso-hide:all"><img src="{{canary}}/keep/phone-hero.png" width="320" height="160" alt="This week"></div>
<!--<![endif]-->
<p style="display:block">The week's news <img src="{{canary}}/keep/inline.png" width="100" height="20" alt="chart"></p>
<div style="height:0"><img src="{{canary}}/keep/overflowing.png" width="100" height="20" alt=""></div>
<div hidden style="display:block"><img src="{{canary}}/keep/unhidden.png" width="100" height="20" alt=""></div>
<img src="{{canary}}/track/display-none.gif" style="display:none" alt="">
<img src="{{canary}}/track/locked.gif" class="dark-logo" style="display:none !important" width="200" height="50" alt="">
<img src="{{canary}}/track/outweighed.gif" class="outweighed" style="display:none" alt="">
<img src="{{canary}}/track/visibility.gif" style="visibility:hidden" width="100" height="20" alt="">
<img src="{{canary}}/track/opacity.gif" style="opacity:0" width="100" height="20" alt="">
<img src="{{canary}}/track/hidden-attribute.gif" hidden alt="">
<img src="{{canary}}/track/zero-height.gif" width="600" height="0" alt="">
<div style="display:none"><table><tr><td><img src="{{canary}}/track/deep.gif" width="100" height="20" alt=""></td></tr></table></div>
<div style="height:0;overflow:hidden"><img src="{{canary}}/track/clipped.gif" alt=""></div>
<span style="opacity:0"><img src="{{canary}}/track/faded.gif" alt=""></span>
