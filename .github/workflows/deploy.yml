name: Deploy

# Production for every push to main, then the public demo, and a preview for every pull request
# from this repository, each once CI has passed: CI calls this workflow after its three jobs.
# Nothing deploys unless the repository holds the Cloudflare secrets, so a fork's pull request,
# which never gets them, builds and tests but never deploys. No step here runs a fork's code with a secret: there is no
# pull_request_target or workflow_run, and every job that deploys runs only for this repository.
on:
  workflow_call:
  # A pull request's preview goes when the pull request closes.
  pull_request:
    types: [closed]
  # Deploys main again. A run reads the repository's secrets and variables when it is queued, so
  # one changed after that reaches production only through a run started later, such as this one.
  workflow_dispatch:

permissions:
  contents: read

# Wrangler runs on Node, from the version the lockfile pins. workers.dev turns away requests with
# some libraries' default user agents before the Worker runs, so the checks of /health name theirs.
#
# The checks reach /health through an Access application that lets everyone through. Access matches
# its path as a prefix, so it lets through /health/anything too. That is safe only because the Worker
# checks every request's sign-in itself and answers /health alone without one: keep that check.
# Removing the Access bypass instead would make every deploy roll back.
env:
  WRANGLER: node node_modules/wrangler/bin/wrangler.js
  USER_AGENT: trail-mix-deploy (+https://github.com/${{ github.repository }})

jobs:
  # Whether this repository can deploy, and whether its Access and Members settings are usable.
  settings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - name: Look for the Cloudflare secrets
        id: secrets
        env:
          READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          echo "ready=$READY" >> "$GITHUB_OUTPUT"
          if [ "$READY" != true ]; then
            echo "::notice::There are no Cloudflare secrets here, so nothing deploys."
          fi

      # Until both are set, every address answers with the setup page, apart from /health.
      - name: Check the Access settings
        env:
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
        run: |
          if [ -z "$ACCESS_TEAM_DOMAIN$ACCESS_AUD" ]; then
            echo "::notice::ACCESS_TEAM_DOMAIN and ACCESS_AUD aren't set, so Trail Mix shows only its setup page."
            exit 0
          fi
          if ! [[ "$ACCESS_TEAM_DOMAIN" =~ ^[a-z0-9-]+\.cloudflareaccess\.com$ ]]; then
            echo "::error::ACCESS_TEAM_DOMAIN is the team domain alone, such as myteam.cloudflareaccess.com."
            exit 1
          fi
          if ! [[ "$ACCESS_AUD" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::ACCESS_AUD is the 64-character Application Audience (AUD) tag of the Trail Mix application."
            exit 1
          fi

      # The Members page needs both: the operator who may use it, and the token it edits Access with.
      - name: Check the Members settings
        env:
          OPERATOR_EMAIL: ${{ vars.OPERATOR_EMAIL }}
          HAS_TOKEN: ${{ secrets.ACCESS_API_TOKEN != '' }}
        run: |
          if [ -n "$OPERATOR_EMAIL" ] && ! [[ "$OPERATOR_EMAIL" =~ ^[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]+$ ]]; then
            echo "::error::OPERATOR_EMAIL is one email address, the one you sign in to Access with."
            exit 1
          fi
          if [ -z "$OPERATOR_EMAIL" ] || [ "$HAS_TOKEN" != true ]; then
            echo "::notice::The Members page needs both OPERATOR_EMAIL and ACCESS_API_TOKEN. Until then it says it isn't set up."
          fi

      # Outlook accounts sign in at Microsoft through the app the operator registered in Entra.
      - name: Check the Outlook sign-in setting
        env:
          MICROSOFT_CLIENT_ID: ${{ vars.MICROSOFT_CLIENT_ID }}
        run: |
          if [ -z "$MICROSOFT_CLIENT_ID" ]; then
            echo "::notice::MICROSOFT_CLIENT_ID isn't set, so adding an Outlook account says it isn't set up."
            exit 0
          fi
          if ! [[ "$MICROSOFT_CLIENT_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "::error::MICROSOFT_CLIENT_ID is the Application (client) ID of your Entra app, such as 00000000-0000-0000-0000-000000000000."
            exit 1
          fi

  production:
    needs: settings
    if: >-
      needs.settings.outputs.ready == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One deploy at a time, each to its end, so a rollback never undoes a newer deploy.
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Prepare the account
        id: account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          config=dist/server/wrangler.json
          worker=$(jq -er .name "$config")
          api() {
            curl -sS --max-time 30 -o "$RUNNER_TEMP/api.json" -w '%{http_code}' \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/$1"
          }
          failed() {
            echo "::error::$1: $(jq -c '.errors // .' "$RUNNER_TEMP/api.json" 2> /dev/null)"
            exit 1
          }

          if [ "$(api workers/subdomain)" != 200 ]; then
            failed "Couldn't read the workers.dev subdomain, which Workers & Pages asks for the first time it opens"
          fi
          address="https://$worker.$(jq -er .result.subdomain "$RUNNER_TEMP/api.json").workers.dev"

          # The version serving now, which a failed deploy rolls back to. None before the first.
          case "$(api "workers/scripts/$worker/deployments")" in
            200)
              # The API lists the deployment serving now first.
              previous=$(jq -r '.result.deployments[0] | (.versions // []) | max_by(.percentage)
                | .version_id // empty' "$RUNNER_TEMP/api.json")
              ;;
            404) previous= ;;
            *) failed "Couldn't read what $worker serves now" ;;
          esac

          # The commit serving now, to see the rollback bring it back.
          before=$(curl -sS --max-time 10 -A "$USER_AGENT" "$address/health" 2> /dev/null | jq -r '.version // empty' 2> /dev/null || true)
          [[ "$before" =~ ^[0-9a-f]{40}$ ]] || before=

          {
            echo "worker=$worker"
            echo "address=$address"
            echo "previous=$previous"
            echo "before=$before"
          } >> "$GITHUB_OUTPUT"
          echo "Production is $address, now serving version ${previous:-none} (commit ${before:-unknown})."

      # `bun run deploy`, as every copy's Deploy to Cloudflare builds run it: it makes any bucket the
      # Worker binds, gives a Worker never deployed its CREDENTIALS_KEY and any Worker without one its
      # PUSH_KEY, and stops rather than give a deployed Worker a new CREDENTIALS_KEY. It names the
      # commit and the account, and passes ACCESS_API_TOKEN on with every deploy while the repository
      # has it, so a token replaced in GitHub reaches the Worker next time. It logs the names of the
      # secrets production keeps, never a value. Variables a deploy doesn't name stay as they were.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
          OPERATOR_EMAIL: ${{ vars.OPERATOR_EMAIL }}
          MICROSOFT_CLIENT_ID: ${{ vars.MICROSOFT_CLIENT_ID }}
          ACCESS_API_TOKEN: ${{ secrets.ACCESS_API_TOKEN }}
        run: |
          args=(--message "Commit $COMMIT")
          if [ -n "$ACCESS_TEAM_DOMAIN" ]; then
            args+=(--var "ACCESS_TEAM_DOMAIN:$ACCESS_TEAM_DOMAIN" --var "ACCESS_AUD:$ACCESS_AUD")
          fi
          if [ -n "$OPERATOR_EMAIL" ]; then
            args+=(--var "OPERATOR_EMAIL:$OPERATOR_EMAIL")
          fi
          if [ -n "$MICROSOFT_CLIENT_ID" ]; then
            args+=(--var "MICROSOFT_CLIENT_ID:$MICROSOFT_CLIENT_ID")
          fi

          node src/shared/build/deploy.ts "${args[@]}"

      - name: Check /health reports the commit
        id: health
        env:
          ADDRESS: ${{ steps.account.outputs.address }}
        run: |
          for _ in $(seq 24); do
            code=$(curl -sS --max-time 10 -A "$USER_AGENT" -o "$RUNNER_TEMP/health.json" -w '%{http_code}' "$ADDRESS/health" || true)
            case "$code" in
              200) reported=$(jq -r '.version // "no version"' "$RUNNER_TEMP/health.json" 2> /dev/null || echo "no JSON") ;;
              302) reported="a sign-in, so Access needs its bypass for /health" ;;
              *) reported="HTTP ${code:-no answer}" ;;
            esac
            if [ "$reported" = "$COMMIT" ]; then
              echo "$ADDRESS/health reports $COMMIT."
              exit 0
            fi
            sleep 5
          done
          echo "::error::$ADDRESS/health didn't report $COMMIT within two minutes. Its last answer was $reported."
          exit 1

      - name: Roll back
        if: failure() && steps.health.outcome == 'failure'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER: ${{ steps.account.outputs.worker }}
          ADDRESS: ${{ steps.account.outputs.address }}
          PREVIOUS: ${{ steps.account.outputs.previous }}
          BEFORE: ${{ steps.account.outputs.before }}
        run: |
          if [ -z "$PREVIOUS" ]; then
            echo "::error::This was the first deploy, so there is no version to roll back to."
            exit 1
          fi
          $WRANGLER rollback "$PREVIOUS" --name "$WORKER" --message "/health didn't report $COMMIT" --yes
          if [ -z "$BEFORE" ]; then
            echo "::error::Rolled back to version $PREVIOUS. /health wasn't readable before the deploy, so it can't be compared."
            exit 1
          fi
          for _ in $(seq 24); do
            reported=$(curl -sS --max-time 10 -A "$USER_AGENT" "$ADDRESS/health" 2> /dev/null | jq -r '.version // empty' 2> /dev/null || true)
            if [ "$reported" = "$BEFORE" ]; then
              echo "::error::Rolled back to version $PREVIOUS: $ADDRESS/health reports $BEFORE again."
              exit 1
            fi
            sleep 5
          done
          echo "::error::Rolled back to version $PREVIOUS, but /health still reports ${reported:-nothing}, not $BEFORE."
          exit 1

  # The public demo, once production is out: no sign-in, the demo mailbox alone, a throwaway
  # Mailroom per visitor. Only this repository has one, so a copy's deploy.yml never puts a public
  # demo on its operator's account.
  demo:
    needs: production
    if: github.repository == 'lostintangent/trail-mix'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: demo
      cancel-in-progress: false
    env:
      COMMIT: ${{ github.sha }}
      CONFIG: dist-demo/server/wrangler.json
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build:demo

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Prepare the account
        id: account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          worker=$(jq -er .name "$CONFIG")
          api() {
            curl -sS --max-time 30 -o "$RUNNER_TEMP/api.json" -w '%{http_code}' \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/$1"
          }
          failed() {
            echo "::error::$1: $(jq -c '.errors // .' "$RUNNER_TEMP/api.json" 2> /dev/null)"
            exit 1
          }

          if [ "$(api workers/subdomain)" != 200 ]; then
            failed "Couldn't read the workers.dev subdomain"
          fi
          address="https://$worker.$(jq -er .result.subdomain "$RUNNER_TEMP/api.json").workers.dev"

          case "$(api "workers/scripts/$worker/deployments")" in
            200)
              previous=$(jq -r '.result.deployments[0] | (.versions // []) | max_by(.percentage)
                | .version_id // empty' "$RUNNER_TEMP/api.json")
              ;;
            404) previous= ;;
            *) failed "Couldn't read what $worker serves now" ;;
          esac

          before=$(curl -sS --max-time 10 -A "$USER_AGENT" "$address/health" 2> /dev/null | jq -r '.version // empty' 2> /dev/null || true)
          [[ "$before" =~ ^[0-9a-f]{40}$ ]] || before=

          {
            echo "worker=$worker"
            echo "address=$address"
            echo "previous=$previous"
            echo "before=$before"
          } >> "$GITHUB_OUTPUT"
          echo "The demo is $address, now serving version ${previous:-none} (commit ${before:-unknown})."

      # `bun run deploy` makes the demo's bucket, and its VISITOR_KEY once, when it has none.
      # Replacing that key would only make every visitor new.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node src/shared/build/deploy.ts --config "$CONFIG" --message "Commit $COMMIT"

      - name: Check /health reports the commit
        id: health
        env:
          ADDRESS: ${{ steps.account.outputs.address }}
        run: |
          for _ in $(seq 24); do
            reported=$(curl -sS --max-time 10 -A "$USER_AGENT" "$ADDRESS/health" 2> /dev/null | jq -r '.version // empty' 2> /dev/null || true)
            if [ "$reported" = "$COMMIT" ]; then
              echo "$ADDRESS/health reports $COMMIT."
              exit 0
            fi
            sleep 5
          done
          echo "::error::$ADDRESS/health didn't report $COMMIT within two minutes. It said ${reported:-nothing}."
          exit 1

      # A new visitor opens the demo mailbox and can't add a real account. The check is a visitor,
      # so it takes one of the day's places, and on a day the demo is already full it can only say so.
      - name: Check a new visitor opens the demo mailbox
        id: visitor
        env:
          ADDRESS: ${{ steps.account.outputs.address }}
        run: bun tests/e2e/demo-check.ts "$ADDRESS"

      - name: Roll back
        if: failure() && (steps.health.outcome == 'failure' || steps.visitor.outcome == 'failure')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER: ${{ steps.account.outputs.worker }}
          PREVIOUS: ${{ steps.account.outputs.previous }}
        run: |
          if [ -z "$PREVIOUS" ]; then
            echo "::error::This was the demo's first deploy, so there is no version to roll back to."
            exit 1
          fi
          $WRANGLER rollback "$PREVIOUS" --name "$WORKER" --message "The demo's checks failed for $COMMIT" --yes
          echo "::error::Rolled the demo back to version $PREVIOUS."
          exit 1

  preview:
    needs: settings
    if: >-
      needs.settings.outputs.ready == 'true' && github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      COMMIT: ${{ github.sha }}
      PREVIEW: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Previews share one bucket, apart from production's. Each preview has its own Mailrooms, and
      # a body's key starts with its Mailroom's id, so no preview reads another's.
      - name: Prepare the account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for bucket in $(jq -r '.previews.r2_buckets[].bucket_name' dist/server/wrangler.json); do
            code=$(curl -sS --max-time 30 -o "$RUNNER_TEMP/api.json" -w '%{http_code}' \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/$bucket")
            case "$code" in
              200) ;;
              404) $WRANGLER r2 bucket create "$bucket" ;;
              *) echo "::error::Couldn't look for the bucket $bucket: $(jq -c '.errors // .' "$RUNNER_TEMP/api.json")"; exit 1 ;;
            esac
          done

      # A preview takes nothing from production, so it gets the Access settings here, and never a
      # secret: no CREDENTIALS_KEY, no ACCESS_API_TOKEN. Its own settings are the `previews` block of
      # wrangler.jsonc.
      - name: Deploy the preview
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
        run: |
          args=(--name "$PREVIEW" --var "VERSION:$COMMIT" --message "Commit $COMMIT")
          if [ -n "$ACCESS_TEAM_DOMAIN" ]; then
            args+=(--var "ACCESS_TEAM_DOMAIN:$ACCESS_TEAM_DOMAIN" --var "ACCESS_AUD:$ACCESS_AUD")
          fi
          # Wrangler prints its progress for the log, and writes what it made, the preview's
          # addresses among it, as one JSON line per command to this file.
          export WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/wrangler-output.jsonl"
          $WRANGLER preview "${args[@]}"
          address=$(jq -ers 'map(select(.type == "preview")) | last | .preview_urls[0]' "$WRANGLER_OUTPUT_FILE_PATH")
          [[ "$address" == https://* ]] || address="https://$address"
          echo "address=${address%/}" >> "$GITHUB_OUTPUT"

      - name: Check /health reports the commit
        env:
          ADDRESS: ${{ steps.deploy.outputs.address }}
        run: |
          for _ in $(seq 24); do
            code=$(curl -sS --max-time 10 -A "$USER_AGENT" -o "$RUNNER_TEMP/health.json" -w '%{http_code}' "$ADDRESS/health" || true)
            case "$code" in
              200) reported=$(jq -r '.version // "no version"' "$RUNNER_TEMP/health.json" 2> /dev/null || echo "no JSON") ;;
              302) reported="a sign-in, so Access needs its bypass for /health" ;;
              *) reported="HTTP ${code:-no answer}" ;;
            esac
            if [ "$reported" = "$COMMIT" ]; then
              echo "$ADDRESS/health reports $COMMIT."
              exit 0
            fi
            sleep 5
          done
          echo "::error::$ADDRESS/health didn't report $COMMIT within two minutes. Its last answer was $reported."
          exit 1

      - name: Post the address on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ADDRESS: ${{ steps.deploy.outputs.address }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body \
            "The preview of $HEAD is at $ADDRESS. It serves only the demo mailbox, to whoever Cloudflare Access lets in."

  # A closed pull request's preview goes, with its Mailrooms. Its bodies stay in the previews' bucket.
  cleanup:
    needs: settings
    if: >-
      needs.settings.outputs.ready == 'true' && github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install
        run: bun install --frozen-lockfile

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Delete the preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW: pr-${{ github.event.pull_request.number }}
        run: $WRANGLER preview delete --name "$PREVIEW" --skip-confirmation
