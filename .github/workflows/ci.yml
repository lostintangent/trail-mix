name: CI

on:
  push:
    branches: [main]
  pull_request:

# The checks only read the repository and use no secret, so they are safe on forks. Only the
# deploy at the end touches a secret, and deploy.yml runs it only for this repository's own changes.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # `bun fmt`, `bun lint` and `bun check` ship in canary builds only.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install
        run: bun install --frozen-lockfile

      - name: Format
        run: bun fmt --check

      # The workflows, and the shell in them, which the runner's ShellCheck reads.
      - name: Lint the workflows
        run: |
          version=1.7.12
          archive=actionlint_${version}_linux_amd64.tar.gz
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v$version/$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum -c -
          tar xzf "$archive" actionlint
          ./actionlint -color
          rm actionlint "$archive"

      - name: Lint
        run: bun lint

      - name: Type-check
        run: bun check

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('bun.lock') }}

      # The reader's tests render hostile mail in Chromium here, and in WebKit in their own job. The
      # smoke suite and the bench below drive the built app in it too.
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Test
        run: bun test
        env:
          READER_BROWSERS: chromium

      - name: Build
        run: bun run build

      # Wrangler runs on Node, as everything that starts the local Workers runtime does.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The Workers runtime's types follow the compatibility date and flags. `bun run types` makes them.
      - name: Check the runtime types are current
        run: node node_modules/wrangler/bin/wrangler.js types --include-env=false --check

      # Builds the exact upload without an account, so a Worker that would not deploy fails here.
      - name: Check the Worker deploys
        run: node node_modules/wrangler/bin/wrangler.js deploy --dry-run

      # The same for a pull request's preview, as its own settings in wrangler.jsonc make it.
      # `wrangler preview` has no dry run, so this deploys a Worker with those settings in their place.
      - name: Check a preview deploys
        run: |
          jq '. + .previews | del(.previews)' dist/server/wrangler.json > dist/server/preview.json
          node node_modules/wrangler/bin/wrangler.js deploy --dry-run --config dist/server/preview.json
          rm dist/server/preview.json

      # Starts the built Worker on workerd and profiles it against Cloudflare's one-second limit.
      - name: Check the Worker starts
        run: node node_modules/wrangler/bin/wrangler.js check startup

      # Drives the built app on workerd at both sizes in both themes, and saves a screenshot of each.
      - name: Smoke test
        run: bun run e2e

      # Measures the workbench's and the reader's budgets in AGENTS.md, and fails when one is over.
      # The Mailroom's are measured in the mail job, which has the test mail server.
      - name: Benchmark the workbench and the reader
        run: bun run bench workbench reader

      - name: Upload the screenshots and benchmark numbers
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: results
          path: test-results/

  # The reader's tests again in WebKit, the engine of every iPhone browser. Its system libraries
  # take minutes to install, so it runs beside the main job instead of inside it.
  webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install
        run: bun install --frozen-lockfile

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-webkit-${{ hashFiles('bun.lock') }}

      # WebKit needs about 180 system packages from apt, and the runner's mirror has stalled on
      # them for more than 20 minutes. They are kept for each runner image and Playwright version.
      - name: Name the runner image
        id: image
        run: echo "name=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: webkit-packages
        with:
          path: ~/webkit-packages
          key: webkit-packages-${{ steps.image.outputs.name }}-${{ hashFiles('bun.lock') }}

      - name: Install WebKit
        run: |
          if [ "${{ steps.webkit-packages.outputs.cache-hit }}" = true ]; then
            sudo dpkg --install ~/webkit-packages/*.deb
            bunx playwright install webkit
          else
            bunx playwright install --with-deps webkit
            mkdir -p ~/webkit-packages
            cp /var/cache/apt/archives/*.deb ~/webkit-packages/
          fi

      - name: Reader tests in WebKit
        run: bun test tests/reader
        env:
          READER_BROWSERS: webkit

      # The composer at a phone's size, where it rises as a sheet, since Safari on an iPhone is
      # where contenteditable misbehaves most. The preview it drives runs on Node.
      - name: Build
        run: bun run build

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Composer in WebKit at a phone's size
        run: bun test ./tests/e2e/composer.e2e.ts
        env:
          E2E_ENGINE: webkit
          E2E_SIZE: phone

  # Mail I/O against the native test mail server: the server's own tests, and the mail check
  # running in a Durable Object on workerd.
  mail:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install Dovecot 2.4.5 from repo.dovecot.org
        run: |
          curl -fsSL https://repo.dovecot.org/DOVECOT-REPO-GPG-2.4 -o dovecot.asc
          # Trust the key only if it is the one dovecot.org publishes.
          gpg --show-keys --with-colons dovecot.asc | grep -q '^fpr:::::::::EF0882079FD4ED32BF8B23B2A1B09EF84EDC5219:'
          gpg --dearmor < dovecot.asc | sudo tee /usr/share/keyrings/dovecot.gpg > /dev/null
          # ubuntu-latest moves between releases, so the suite and the package build follow the runner.
          . /etc/os-release
          printf 'Types: deb\nURIs: https://repo.dovecot.org/ce-2.4.5/ubuntu/%s\nSuites: %s\nComponents: main\nSigned-By: /usr/share/keyrings/dovecot.gpg\n' \
            "$VERSION_CODENAME" "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/dovecot.sources > /dev/null
          # Only the test mail server's own unprivileged instance runs. The packaged service never starts.
          printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d > /dev/null
          sudo chmod +x /usr/sbin/policy-rc.d
          sudo apt-get update -qq
          v=2:2.4.5-2+ubuntu$VERSION_ID
          sudo apt-get install -y -qq --no-install-recommends dovecot-core="$v" dovecot-imapd="$v" dovecot-lmtpd="$v"

      - name: Name the runner image
        id: image
        run: echo "name=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      # mutt reads Trail Mix's mail in the tests. Its packages are kept for each runner image, so the
      # job doesn't wait on the apt mirror for them. PHP, which serves Roundcube, comes with the image.
      - uses: actions/cache@v6
        id: mutt-packages
        with:
          path: ~/mutt-packages
          key: mutt-packages-${{ steps.image.outputs.name }}

      - name: Install mutt
        run: |
          if [ "${{ steps.mutt-packages.outputs.cache-hit }}" = true ]; then
            sudo dpkg --install ~/mutt-packages/*.deb
          else
            sudo apt-get clean
            sudo apt-get install -y -qq --no-install-recommends mutt
            mkdir -p ~/mutt-packages
            cp /var/cache/apt/archives/*.deb ~/mutt-packages/
          fi

      # Roundcube, the other client, is downloaded by the tests and kept until its pinned release changes.
      - uses: actions/cache@v6
        with:
          path: .mail-server/clients/roundcubemail-*
          key: roundcube-${{ hashFiles('tests/mail-clients/roundcube.ts') }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      # The mail check starts workerd, which runs under Node.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install
        run: bun install --frozen-lockfile

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('bun.lock') }}

      # The reader renders the demo mailbox, read through the Mailroom on workerd, in Chromium.
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      # The other mail clients read what the built app's composer writes.
      - name: Build
        run: bun run build

      - name: Mail tests
        run: bun run test:mail
        env:
          READER_BROWSERS: chromium
          # Roundcube and mutt are installed above, so their tests fail rather than skip.
          MAIL_CLIENTS: required

      # The bench's 50,000 messages take half a minute to load into the test mail server, so they
      # are kept between runs until what the demo says changes. They're kept as soon as they have
      # loaded, so a bench that fails later doesn't load them again next time, and a load that
      # failed is never kept.
      - name: Restore the bench's mailbox
        id: bench-mailbox
        uses: actions/cache/restore@v6
        with:
          path: .mail-server/state/mail/bench@trailmix.test
          key: bench-mailbox-${{ runner.os }}-${{ hashFiles('src/features/providers/demo/**', 'src/features/mail/core/mime.ts', 'tests/bench/mailroom/seed.ts') }}

      - name: Load the bench's mailbox
        run: bun tests/bench/mailroom/seed.ts

      - name: Keep the bench's mailbox
        if: steps.bench-mailbox.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .mail-server/state/mail/bench@trailmix.test
          key: ${{ steps.bench-mailbox.outputs.cache-primary-key }}

      # The Mailroom's budgets: a first sync of 50,000 messages from the test mail server, and reads
      # from the index it fills. This job is the one with Dovecot.
      - name: Benchmark the Mailroom
        run: bun run bench mailroom

      # Also what a failed mail test left: a screenshot of each page and what it showed.
      - name: Upload the Mailroom's numbers
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: mailroom-bench
          path: test-results/

      - name: Test mail server logs
        if: failure()
        run: tail -n 50 .mail-server/state/dovecot.log .mail-server/state/serve.log

  # Production for a push to main, and a preview for a pull request from this repository, once all
  # three jobs pass. deploy.yml deploys nothing where the Cloudflare secrets don't exist.
  deploy:
    needs: [check, webkit, mail]
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write
